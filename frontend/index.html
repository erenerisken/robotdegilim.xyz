<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f7f9" />
    <meta name="description" content="Build a conflict-free METU course schedule." />
    <link rel="icon" href="/favicon.ico" />
    <title>Robot Değilim — METU Schedule Builder</title>
  </head>
  <body>
    <script>
      // Paint the right background before React mounts, so opening the page in
      // dark mode does not flash white.
      (function () {
        try {
          var stored = localStorage.getItem("robotdegilim-theme");
          var dark =
            stored !== null
              ? stored === "dark"
              : window.matchMedia &&
                window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.setAttribute(
            "data-theme",
            dark ? "dark" : "light"
          );
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/index.js"></script>
  </body>
</html>
